trigger:
- main
pool:
  vmImage: ubuntu-latest
stages:
- stage: Build
  jobs:
    - job: BuildJob
    steps:
        - script: echo Build OK
- stage: Dev
  dependsOn: Build
  jobs:
    - job: DevJob
    steps:
        - script: |
        echo Building Docker
        docker build -t myproject .
- stage: QA
  dependsOn: Dev
  jobs:
    - job: QAJob
    steps:
        - script: echo QA OK
- stage: Prod
  dependsOn: QA
  jobs:
    - job: ProdJob
    steps:
        - script: echo Prod OK
