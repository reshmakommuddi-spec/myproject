trigger:
- main
pool:
  vmImage: ubuntu-latest
stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - script: echo Build OK
- stage: Dev
  dependsOn: Build
  jobs: 
  - job: DevJob
    steps:
    - script: echo Deploy to Dev OK
- stage: QA
  dependsOn: Dev
  jobs:
  - job: QAJob
    steps:
    - script: echo Deploy to QA OK
- stage: PROD
  dependsOn: QA
  jobs:
  - job: ProdJob
    steps: 
    - script: echo Deploy to Prod OK

