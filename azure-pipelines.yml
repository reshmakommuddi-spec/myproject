trigger:
- main
pool:
  vmImage: 'ubuntu-latest'
steps:
- task: SonarQubeCloudPrepare@2
  inputs:
    SonarCloud: 'SonarCloud'
    organization: 'reshma-devops1'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: 'reshma-devops1_myproject'
    cliProjectName: 'myproject'
    cliSources: '.'
  displayName: 'Prepare SonarCloud'
- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt || echo "No requirements.txt"
  displayName: 'Install dependencies'
- script: |
    pytest --maxfail=1 --disable-warnings -q --cov=. --cov-report=xml || echo "No tests"
  displayName: 'Run tests with coverage'
  continueOnError: true
- task: SonarQubeCloudAnalyze@2
  displayName: 'Run SonarCloud analysis'
- task: SonarQubeCloudPublish@2
  inputs:
    pollingTimeoutSec: '300'
  displayName: 'Publish results'
