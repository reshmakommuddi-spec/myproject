trigger:
- main

stages:
- stage: Build
  displayName: 1_BUILD
  jobs:
    - job: BuildJob
    pool:
      vmImage: ubuntu-latest
    steps:
        - script: echo Build OK

- stage: Docker
  displayName: 2_DOCKER
  dependsOn: Build
  jobs:
    - job: DockerJob
    pool:
      vmImage: ubuntu-latest
    steps:
        - script: echo Docker OK

- stage: Dev
  displayName: 3_DEV
  dependsOn: Docker
  jobs:
    - job: DevJob
    pool:
      vmImage: ubuntu-latest
    steps:
        - script: echo Dev OK

- stage: QA
  displayName: 4_QA
  dependsOn: Dev
  jobs:
    - job: QAJob
    pool:
      vmImage: ubuntu-latest
    steps:
        - script: echo QA OK

- stage: Prod
  displayName: 5_PROD
  dependsOn: QA
  jobs:
    - job: ProdJob
    pool:
      vmImage: ubuntu-latest
    steps:
        - script: echo Prod OK
