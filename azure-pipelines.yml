trigger: none

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  jobs:
    - job: BuildJob
    steps:
        - script: echo "Build OK"
      displayName: Build
- stage: Deploy_Dev
  dependsOn: Build
  jobs:
    - deployment: DeployDev
    displayName: Deploy to Dev
    environment: Dev
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "Deploy Dev OK"
- stage: Deploy_QA
  dependsOn: Deploy_Dev
  jobs:
    - deployment: DeployQA
    displayName: Deploy to QA
    environment: QA
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "Deploy QA OK"
- stage: Deploy_Prod
  dependsOn: Deploy_QA
  jobs:
    - deployment: DeployProd
    displayName: Deploy to Prod
    environment: Prod
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "Deploy Prod OK"
