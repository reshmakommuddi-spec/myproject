trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: SonarQubeCloudPrepare@2
  inputs:
    SonarQubeCloud: 'SonarCloud'
    organization: 'reshma-devops1'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: 'reshma-devops1_myproject'
    cliProjectName: 'myproject'
    cliSources: '.'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt || echo "no requirements"
    pip install pytest pytest-cov
  displayName: 'Install deps'

- script: |
    pytest --cov=. --cov-report=xml -q || echo "no tests"
  displayName: 'Run tests'
  continueOnError: true

- task: SonarQubeCloudAnalyze@2
  displayName: 'Run SonarQube Analysis'

- task: SonarQubeCloudPublish@2
  inputs:
    pollingTimeoutSec: '300'
  displayName: 'Publish Results'
