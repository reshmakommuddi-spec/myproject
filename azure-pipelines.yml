trigger: none

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
    - job: BuildJob
    steps:
        - script: echo "Build OK"
      displayName: 'Build'
- stage: Deploy_Dev
  displayName: 'Deploy to Dev'
  dependsOn: Build
  jobs:
    - deployment: DeployDev
    displayName: 'Deploy to Dev'
    environment: 'Dev'
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "Deploy Dev OK"
- stage: Deploy_QA
  displayName: 'Deploy to QA'
  dependsOn: Deploy_Dev
  jobs:
    - deployment: DeployQA
    displayName: 'Deploy to QA'
    environment: 'QA'
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "Deploy QA OK"
- stage: Deploy_Prod
  displayName: 'Deploy to Prod'
  dependsOn: Deploy_QA
  jobs:
    - deployment: DeployProd
    displayName: 'Deploy to Prod'
    environment: 'Prod'
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "Deploy Prod OK"
