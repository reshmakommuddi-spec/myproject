trigger:
- main
stages:
- stage: Build
  displayName: Build
  pool:
    vmImage: ubuntu-latest
  jobs:
    - job: BuildJob
      steps:
        - script: echo Build OK
- stage: Docker
  displayName: Docker
  dependsOn: Build
  pool:
    vmImage: ubuntu-latest
  jobs:
    - job: DockerJob
      steps:
        - script: echo Docker OK
- stage: Dev
  displayName: Dev
  dependsOn: Docker
  pool:
    vmImage: ubuntu-latest
  jobs:
    - job: DevJob
      steps:
        - script: echo Dev OK
- stage: QA
  displayName: QA
  dependsOn: Dev
  pool:
    vmImage: ubuntu-latest
  jobs:
    - job: QAJob
      steps:
        - script: echo QA OK
- stage: Prod
  displayName: Prod
  dependsOn: QA
  pool:
    vmImage: ubuntu-latest
  jobs:
    - job: ProdJob
      steps:
        - script: echo Prod OK