trigger:
- main

variables:
  dockerRegistry: 'dockerhub-connection'
  imageName: 'reshmakommuddi/reshmadevops-app'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: '1. BUILD'
  jobs:
    - job: BuildJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - script: echo "Build OK"

- stage: Docker
  displayName: '2. DOCKER'
  dependsOn: Build
  jobs:
    - job: DockerJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - task: Docker@2
      inputs:
        command: 'buildAndPush'
        repository: '$(imageName)'
        dockerfile: '**/Dockerfile'
        containerRegistry: '$(dockerRegistry)'
        tags: |
          $(tag)
          latest

- stage: Dev
  displayName: '3. DEV'
  dependsOn: Docker
  jobs:
    - job: DevJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - script: echo "DEV"

- stage: QA
  displayName: '4. QA'
  dependsOn: Dev
  jobs:
    - job: QAJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - script: echo "QA"

- stage: Prod
  displayName: '5. PROD'
  dependsOn: QA
  jobs:
    - deployment: ProdJob
    environment: 'Prod'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "PROD LIVE"
