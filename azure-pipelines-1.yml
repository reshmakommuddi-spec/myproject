trigger:
- main
variables:
  dockerRegistry: 'dockerhub-connection'
  imageName: 'reshmakommuddi/reshmadevops-app'
  tag: '$(Build.BuildId)'
stages:
- stage: Build
  jobs:
    - job: BuildJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - script: echo "Build OK"
- stage: Docker
  displayName: 'Docker Push'
  dependsOn: Build
  jobs:
    - job: DockerJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - task: Docker@2
      inputs:
        command: 'buildAndPush'
        repository: '$(imageName)'
        dockerfile: '**/Dockerfile'
        containerRegistry: '$(dockerRegistry)'
        tags: |
          $(tag)
          latest
- stage: Dev
  dependsOn: Docker
  jobs:
    - job: DevJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - script: echo "DEV OK"
- stage: QA
  dependsOn: Dev
  jobs:
    - job: QAJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - script: echo "QA OK"
- stage: Prod
  dependsOn: QA
  jobs:
    - deployment: ProdJob
    environment: 'Prod'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "PROD LIVE"
